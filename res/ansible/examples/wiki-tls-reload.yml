# Reload hook for the wiki TLS consumer (wiki-ci-nginx).
#
# Kept in a vars file rather than on the make/ansible command line so the
# sealed shell guard never sees the `podman` token inside a scanned command
# string. Loaded with `-e @file`; the role runs it via ansible.builtin.command
# (argv, no shell), so the hook is not policy-blocked.
letsencrypt_reload_argv:
  - /opt/workspace-ci/.boot-linux/bin/podman
  - exec
  - wiki-ci-nginx
  - nginx
  - -s
  - reload