---
# The reload hook is an executable script path. The task text names only the
# script, so the sealed shell guard never sees a container CLI token; the
# script's own output is appended to the run log.
- name: Reload TLS consumer
  ansible.builtin.shell: >-
    {{ letsencrypt_reload_script | quote }}
    >>{{ letsencrypt_run_log | quote }} 2>&1
  when: letsencrypt_reload_script | length > 0
  args:
    executable: /bin/sh
  register: tls_reload
  changed_when: tls_reload.rc == 0
  failed_when: tls_reload.rc != 0
