# Schema for banned_words.yaml: field-level documentation (v5 final model).
#
# Convention: one config/<name>.schema.yaml per config/<name>.yaml.
# Consumed by the wiki's ConfigFieldTable component (SPEC-WIKI.md §10.7)
# to render field/type/default/description for the configuration reference
# pages (FR-7.3). This file is the canonical source for field descriptions;
# the wiki derives documentation from it, never hand-maintaining prose.
config: banned_words
description: "Universal banned-pattern rules and exact one-file-one-rule exemptions; the single source of truth for content bans. Enforced shape: lib/check_policy_integrity.py."
fields:
  - path: version
    type: string
    required: true
    description: "Schema version; must be 5.x."

  - path: rules
    type: list
    required: true
    description: "The universal rule list. Every rule carries a stable unique kebab-case id, a declared matching mode, and declared case behavior."

  - path: rules[].id
    type: string
    required: true
    description: "Stable unique rule identifier (kebab-case). Exemptions reference rules by this id, never by pattern text."

  - path: rules[].mode
    type: string
    required: true
    description: "Matching mode: raw-regex (syntax-significant patterns), normalized-token, normalized-path, or filename."

  - path: rules[].case
    type: string
    required: true
    description: "Case behavior: sensitive or fold. Normalized modes fold by default; a sensitive rule declares it explicitly."

  - path: rules[].pattern
    type: string
    required: true
    description: "Regex pattern for the declared mode; compiled once per checker process."

  - path: rules[].reason
    type: string
    required: true
    description: "Human-readable explanation surfaced on violation and rendered in the wiki pattern library."

  - path: rules[].category
    type: string
    required: false
    description: "Pattern category id (see config/pattern_categories.yaml). Drives wiki categorization."

  - path: rules[].scope
    type: string
    required: false
    default: all
    description: "Declared applicability for ordinary rules: all (every tracked text file), production (not test-classified paths), or docs (documentation paths). Non-exemptible rules must be 'all'."

  - path: rules[].non_exemptible
    type: boolean
    required: false
    default: false
    description: "True when no exemption may ever reference this rule (system interpreters, destructive operations, integrity rules). Enforced structurally."

  - path: directory_rules
    type: map
    description: "Additive rules scoped to a named directory key; entries carry the same id/mode/case fields as rules."

  - path: filename_rules
    type: list
    description: "Rules matched against the normalized basename and the complete repository-relative path; mode must be filename."

  - path: exceptions
    type: list
    description: "Universal exemptions. Every entry is exactly one rule id plus one anchored exact repository-relative regular-file path with full provenance."

  - path: exceptions[].rule
    type: string
    required: true
    description: "Stable rule id being exempted; must exist and must not be non-exemptible."

  - path: exceptions[].path
    type: string
    required: true
    description: "Anchored exact regex (^path$) matching exactly one tracked regular file; no metacharacters, globs, alternation, or directory scopes."

  - path: exceptions[].rationale
    type: string
    required: true
    description: "Why this exact file must match this exact rule and how the file remains non-executable."

  - path: exceptions[].owner
    type: string
    required: true
    description: "Accountable owner of the exemption."

  - path: exceptions[].review_date
    type: string
    required: true
    description: "ISO date of the last review (YYYY-MM-DD)."

  - path: exceptions[].removal
    type: string
    required: true
    description: "Expiry date or removal condition for the exemption."
