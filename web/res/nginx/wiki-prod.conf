map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    return 301 https://$host$request_uri;
}

# Internal, container-network-only probe endpoint (never published; reachable
# only from the wiki bridge). Plain HTTP, no TLS redirect, so the Next.js
# server can health-check Grafana without a cert/Host match. The app keeps no
# gw-edge access; this goes through the pinned Grafana address.
server {
    listen 80;
    listen [::]:80;
    server_name wiki-nginx wiki-ci-nginx;

    location /grafana/ {
        proxy_pass http://10.99.60.3:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    # Grafana is pinned at 10.99.60.3 on the shared gw-edge bridge. Use the
    # static address (not DNS): nginx's resolver uses only the first container
    # nameserver, and wiki/gw-edge have different podman DNS servers.
    location /grafana/ {
        proxy_pass http://10.99.60.3:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-WEBAUTH-USER wiki-embed;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Lazy-resolve wiki-app: upstream blocks resolve once at startup and can pin
    # stale container IPs after a stack recreate; variable proxy_pass re-resolves.
    location / {
        resolver __RESOLVER__ valid=30s ipv6=off;
        set $wiki_upstream wiki-app:3000;
        proxy_pass http://$wiki_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}