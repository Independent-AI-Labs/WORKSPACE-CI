# workspace-ci Wiki production stack (Podman Compose).
#
# Host ports: HTTP 8080 -> nginx 80, HTTPS 8443 -> nginx 443 (unprivileged; no root).
# Override for privileged ports: WIKI_HTTP_PORT=80 WIKI_HTTPS_PORT=443

services:
  wiki-app:
    image: localhost/workspace-ci-wiki:0.1.0
    pull_policy: never
    container_name: wiki-ci-app
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost,https://127.0.0.1}
      # Unset = auto-derive https://<request-host>/grafana per request (same-origin iframes).
      GRAFANA_BASE_URL: ${GRAFANA_BASE_URL:-}
      # Server-side health probe goes through the local edge proxy (never
      # gw-edge directly): the app holds no Grafana trust-path network access.
      GRAFANA_INTERNAL_HEALTH_URL: ${GRAFANA_INTERNAL_HEALTH_URL:-http://wiki-nginx/grafana/api/health}
      WIKI_HOME_LANDING_ENABLED: ${WIKI_HOME_LANDING_ENABLED:-true}
      WIKI_DEV_PORT: ${WIKI_DEV_PORT:-4000}
      WORKSPACE_WEB_CONTENT_ROOT: /workspace/WORKSPACE-WEB-CONTENT
      CI_WEB_DATA_DIR: ${CI_WEB_DATA_DIR:-/workspace/CI/web/src/data}
      WIKI_FEEDBACK_DIR: ${WIKI_FEEDBACK_DIR:-/workspace/CI/web/data/feedback}
    expose:
      - "3000"
    volumes:
      - wiki-feedback:/workspace/CI/web/data/feedback
    networks:
      - wiki
    restart: unless-stopped

  wiki-nginx:
    image: docker.io/library/nginx:1.27.4
    container_name: wiki-ci-nginx
    depends_on:
      - wiki-app
    networks:
      wiki: {}
      gw-edge:
        # Pinned: Grafana's auth-proxy whitelist trusts exactly this address
        # (GRAFANA_EDGE_CIDR=10.99.60.2/32). See RUNBOOK-EDGE-PROXY.
        ipv4_address: 10.99.60.2
    ports:
      - "${WIKI_HTTP_PORT:-8080}:80"
      - "${WIKI_HTTPS_PORT:-8443}:443"
    environment:
      WIKI_TLS_CN: ${WIKI_TLS_CN:-localhost}
      WIKI_TLS_DIR: /etc/nginx/certs
      WIKI_TLS_MODE: ${WIKI_TLS_MODE:-auto}
    volumes:
      - ./res/nginx/wiki-prod.conf:/scripts/wiki-prod.conf.template:ro
      - ./scripts/gen-self-signed-cert.sh:/scripts/gen-self-signed-cert.sh:ro
      - ./res/nginx/entrypoint.sh:/entrypoint.sh:ro
      - ${WIKI_TLS_DIR:?Set WIKI_TLS_DIR to the host cert directory}:/etc/nginx/certs
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    restart: unless-stopped

volumes:
  wiki-feedback:

networks:
  wiki:
  gw-edge:
    external: true
    name: docker_gw-edge
