<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workspace capabilities</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css" rel="stylesheet" />
<style>
  @property --glow {
    syntax: '<color>';
    inherits: false;
    initial-value: transparent;
  }

  :root {
    --bg: #181818;
    --text: #ededed;
    --muted: #9a9a9a;
    --idle: #ffffff;
    --size: min(620px, 92vw, 92vh);
    --track: #101010;
  }

  [data-theme='light'] {
    --bg: #f0f0f0;
    --text: #1a1a1a;
    --muted: #5a5a5a;
    --idle: #ffffff;
    --track: #e2e2e2;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 0.5rem;
    -webkit-font-smoothing: antialiased;
  }

  .dial {
    position: relative;
    width: var(--size);
    height: var(--size);
  }

  .dial svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .track {
    fill: none;
    stroke: var(--track);
    stroke-width: 52;
  }

  .arc {
    fill: none;
    stroke: var(--idle);
    stroke-width: 52;
    stroke-linecap: round;
    --glow: transparent;
    filter: drop-shadow(0 0 14px var(--glow));
    transition:
      stroke 380ms ease calc(var(--i, 0) * 70ms),
      stroke-width 200ms ease,
      opacity 200ms ease,
      --glow 320ms ease;
    cursor: pointer;
    outline: none;
  }

  .seg.lit .arc {
    stroke: var(--lit);
  }

  .leader {
    stroke: var(--muted);
    stroke-width: 1.5;
    transition: stroke 150ms ease, stroke-width 150ms ease;
  }

  .label {
    fill: var(--muted);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    transition: fill 150ms ease;
  }

  .float {
    transform-box: fill-box;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    --glow: transparent;
    filter: drop-shadow(0 0 6px var(--glow));
    transition: opacity 200ms ease, --glow 320ms ease;
  }

  .float--a { animation-name: float-a; animation-duration: 9s; }
  .float--b { animation-name: float-b; animation-duration: 12s; animation-delay: -4s; }
  .float--c { animation-name: float-c; animation-duration: 10.5s; animation-delay: -2s; }
  .float--d { animation-name: float-b; animation-duration: 13s; animation-delay: -7s; }
  .float--e { animation-name: float-a; animation-duration: 11s; animation-delay: -5.5s; }
  .float--f { animation-name: float-c; animation-duration: 8.5s; animation-delay: -3s; }

  @keyframes float-a {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(2px, -3px); }
    50% { transform: translate(-2px, 1px); }
    75% { transform: translate(1px, 2px); }
  }

  @keyframes float-b {
    0%, 100% { transform: translate(0, 0); }
    30% { transform: translate(-3px, 2px); }
    60% { transform: translate(2px, 2px); }
    80% { transform: translate(1px, -2px); }
  }

  @keyframes float-c {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(1px, 3px); }
    55% { transform: translate(-2px, -1px); }
    85% { transform: translate(2px, -2px); }
  }

  .seg:hover .arc,
  .seg:focus-within .arc {
    stroke-width: 62;
    --glow: color-mix(in srgb, var(--lit) 70%, transparent);
  }

  .seg:hover .float,
  .seg:focus-within .float {
    --glow: color-mix(in srgb, var(--lit) 80%, transparent);
  }

  .seg:hover .leader,
  .seg:focus-within .leader {
    stroke: var(--lit);
    stroke-width: 2;
  }

  .seg:hover .label,
  .seg:focus-within .label {
    fill: var(--text);
  }

  .hole {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 0 33%;
    text-align: center;
  }

  .hole__idle {
    transition: opacity 150ms ease;
  }

  .hole__idle.is-hidden {
    opacity: 0;
  }

  .hole__idle-title {
    display: block;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .hole__idle-hint {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.74rem;
    line-height: 1.4;
    color: var(--muted);
  }

  .hole__content {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40%;
    max-height: 40%;
    overflow: hidden;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.96);
    transition: opacity 150ms ease, transform 150ms ease;
  }

  .hole__content.is-active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  .hole__icon {
    display: block;
    font-size: 1.5rem;
    line-height: 1;
    margin-bottom: 0.3rem;
    color: color-mix(in oklab, var(--c, var(--text)) 62%, var(--text));
  }

  .hole__title {
    margin: 0 0 0.3rem;
    font-size: 0.9rem;
    font-weight: 700;
    color: color-mix(in oklab, var(--c, var(--text)) 62%, var(--text));
  }

  .hole__body {
    margin: 0;
    font-size: 0.7rem;
    line-height: 1.5;
    color: var(--muted);
  }

  @media (max-width: 520px) {
    .label { font-size: 16px; }
    .hole__body { font-size: 0.62rem; }
    .hole__title { font-size: 0.8rem; }
    .hole__icon { font-size: 1.25rem; }
  }
</style>
</head>
<body>
<div class="dial">
  <svg viewBox="-140 -140 700 700" role="list" aria-label="Workspace capabilities">
    <circle class="track" cx="210" cy="210" r="186"></circle>

    <g class="seg" style="--lit:hsl(0 85% 60%); --i:0;" data-index="0" data-title="Integrate" data-color="hsl(0 85% 60%)" data-icon="ri-plug-line"
      data-desc="Adopt the layers you need: the kernel guard, the CI engine, virtualization, or the gateway on its own, and bring your existing work in as-is.">
      <circle class="arc" cx="210" cy="210" r="186" role="listitem" tabindex="0"
        transform="rotate(-76.5 210 210)" stroke-dasharray="107.128 1061.544"></circle>
      <g class="float float--a">
        <line class="leader" x1="317" y1="24.7" x2="335" y2="-6.5"></line>
        <text class="label" x="341" y="-16.9" text-anchor="start" dominant-baseline="middle">Integrate</text>
      </g>
    </g>

    <g class="seg" style="--lit:hsl(28 88% 56%); --i:1;" data-index="1" data-title="Govern code" data-color="hsl(28 88% 56%)" data-icon="ri-shield-check-line"
      data-desc="Run safety and quality gates on every commit and push: lint, tests, secret scanning, banned patterns, dependency checks, and size limits. Let the guard at the git boundary refuse --no-verify, force-push, and history rewriting.">
      <circle class="arc" cx="210" cy="210" r="186" role="listitem" tabindex="0"
        transform="rotate(-16.5 210 210)" stroke-dasharray="107.128 1061.544"></circle>
      <g class="float float--b">
        <line class="leader" x1="424" y1="210" x2="460" y2="210"></line>
        <text class="label" x="472" y="210" text-anchor="start" dominant-baseline="middle">Govern code</text>
      </g>
    </g>

    <g class="seg" style="--lit:hsl(56 90% 52%); --i:2;" data-index="2" data-title="Govern AI" data-color="hsl(56 90% 52%)" data-icon="ri-robot-2-line"
      data-desc="Send every model call through an AI policy gateway that authenticates callers, sets per-tenant rate and spend limits, redacts sensitive data, and records usage and cost.">
      <circle class="arc" cx="210" cy="210" r="186" role="listitem" tabindex="0"
        transform="rotate(43.5 210 210)" stroke-dasharray="107.128 1061.544"></circle>
      <g class="float float--c">
        <line class="leader" x1="317" y1="395.3" x2="335" y2="426.5"></line>
        <text class="label" x="341" y="436.9" text-anchor="start" dominant-baseline="middle">Govern AI</text>
      </g>
    </g>

    <g class="seg" style="--lit:hsl(84 70% 50%); --i:3;" data-index="3" data-title="Isolate" data-color="hsl(84 70% 50%)" data-icon="ri-box-3-line"
      data-desc="Sandbox agent and service runtimes in auditable virtual machines, with kill-switching and other controls in place: network off by default, read-only root filesystem, all Linux capabilities dropped, no-new-privileges, and resource limits.">
      <circle class="arc" cx="210" cy="210" r="186" role="listitem" tabindex="0"
        transform="rotate(103.5 210 210)" stroke-dasharray="107.128 1061.544"></circle>
      <g class="float float--d">
        <line class="leader" x1="103" y1="395.3" x2="85" y2="426.5"></line>
        <text class="label" x="79" y="436.9" text-anchor="end" dominant-baseline="middle">Isolate</text>
      </g>
    </g>

    <g class="seg" style="--lit:hsl(112 58% 48%); --i:4;" data-index="4" data-title="Run services" data-color="hsl(112 58% 48%)" data-icon="ri-server-line"
      data-desc="Deploy services contained on one host or distributed across your private and rented infrastructure: local inference, dashboards, containerised services, and anything else you need.">
      <circle class="arc" cx="210" cy="210" r="186" role="listitem" tabindex="0"
        transform="rotate(163.5 210 210)" stroke-dasharray="107.128 1061.544"></circle>
      <g class="float float--e">
        <line class="leader" x1="-4" y1="210" x2="-40" y2="210"></line>
        <text class="label" x="-52" y="210" text-anchor="end" dominant-baseline="middle">Run services</text>
      </g>
    </g>

    <g class="seg" style="--lit:hsl(140 60% 42%); --i:5;" data-index="5" data-title="Own the stack" data-color="hsl(140 60% 42%)" data-icon="ri-stack-line"
      data-desc="Own the infrastructure, the code, and the data. Integrate or migrate your existing technology stack to FOSS in a secure, auditable environment.">
      <circle class="arc" cx="210" cy="210" r="186" role="listitem" tabindex="0"
        transform="rotate(223.5 210 210)" stroke-dasharray="107.128 1061.544"></circle>
      <g class="float float--f">
        <line class="leader" x1="103" y1="24.7" x2="85" y2="-6.5"></line>
        <text class="label" x="79" y="-16.9" text-anchor="end" dominant-baseline="middle">Own the stack</text>
      </g>
    </g>
  </svg>

  <div class="hole">
    <div class="hole__idle">
      <span class="hole__idle-title">Workspace capabilities</span>
      <span class="hole__idle-hint">Hover or focus an arc for details.</span>
    </div>
    <div class="hole__content">
      <i class="hole__icon"></i>
      <p class="hole__title"></p>
      <p class="hole__body"></p>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search)
  const requested = params.get('theme')
  const systemLight =
    window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
  const theme =
    requested === 'light' || requested === 'dark'
      ? requested
      : systemLight
        ? 'light'
        : 'dark'
  document.documentElement.setAttribute('data-theme', theme)

  const dial = document.querySelector('.dial')
  const idle = dial.querySelector('.hole__idle')
  const content = dial.querySelector('.hole__content')
  const iconEl = content.querySelector('.hole__icon')
  const titleEl = content.querySelector('.hole__title')
  const bodyEl = content.querySelector('.hole__body')
  const segs = Array.from(dial.querySelectorAll('.seg'))

  let hideTimer = null

  function cancelHide() {
    if (hideTimer !== null) {
      clearTimeout(hideTimer)
      hideTimer = null
    }
  }

  function lightUp(index) {
    segs.forEach((seg, i) => seg.classList.toggle('lit', i <= index))
  }

  function clearLight() {
    segs.forEach((seg) => seg.classList.remove('lit'))
  }

  function show(seg) {
    iconEl.className = 'hole__icon ' + seg.dataset.icon
    titleEl.textContent = seg.dataset.title
    bodyEl.textContent = seg.dataset.desc
    content.style.setProperty('--c', seg.dataset.color)
    content.classList.add('is-active')
    idle.classList.add('is-hidden')
  }

  function reset() {
    content.classList.remove('is-active')
    idle.classList.remove('is-hidden')
  }

  function activate(seg, i) {
    cancelHide()
    lightUp(i)
    show(seg)
  }

  function scheduleHide() {
    cancelHide()
    hideTimer = window.setTimeout(() => {
      hideTimer = null
      clearLight()
      reset()
    }, 260)
  }

  segs.forEach((seg, i) => {
    seg.addEventListener('mouseenter', () => activate(seg, i))
    seg.addEventListener('mouseleave', scheduleHide)
    seg.addEventListener('focusin', () => activate(seg, i))
    seg.addEventListener('focusout', () => scheduleHide())
  })

  content.addEventListener('mouseenter', cancelHide)
  content.addEventListener('mouseleave', scheduleHide)
</script>
</body>
</html>
