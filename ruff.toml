exclude = ["__pycache__", "*.egg-info", ".venv", ".git", "node_modules", ".pytest_cache", ".boot-linux", ".boot-macos", "projects"]
line-length = 88

[lint]
select = [
    "E", "F", "W", "I", "C", "B", "PL", "PT", "SIM", "UP", "RUF", "TRY", "FLY", "PERF", "FURB", "PYI", "TID", "PLC0415"
]
[lint.per-file-ignores]
# The structural lock comparator accumulates independent diagnostics by design.
"ci/dependency_locks.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
